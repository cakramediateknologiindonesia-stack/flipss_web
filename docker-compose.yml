services:
  web-blue:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.flipss.id}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://flipss.id}
    image: flips_web:${BLUE_TAG:-blue}
    container_name: flips_web_blue
    restart: unless-stopped
    networks:
      - flips
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web-green:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.flipss.id}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://flipss.id}
    image: flips_web:${GREEN_TAG:-green}
    container_name: flips_web_green
    restart: unless-stopped
    networks:
      - flips
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  proxy:
    image: nginx:1.27-alpine
    container_name: flips_proxy
    restart: unless-stopped
    ports:
      - "${PORT:-3088}:80"
    volumes:
      - ./.deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - flips

networks:
  flips:
    name: flips_net
